<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Riya Raj — Computer Science, AI and Cybersecurity</title>
  <desc id="desc">A dark futuristic banner with a neon purple and cyan grid, abstract circuit lines, and the name Riya Raj.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B18"/>
      <stop offset="0.55" stop-color="#11102A"/>
      <stop offset="1" stop-color="#071923"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9333EA" stop-opacity=".25"/>
      <stop offset="1" stop-color="#9333EA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#64748B" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <ellipse cx="320" cy="155" rx="390" ry="250" fill="url(#glow)"/>
  <path d="M0 292H180L215 257H365L402 220H535" fill="none" stroke="#A855F7" stroke-opacity=".65" stroke-width="2"/>
  <path d="M1200 75H1050L1015 110H900L860 150H760" fill="none" stroke="#22D3EE" stroke-opacity=".65" stroke-width="2"/>
  <g fill="#22D3EE" filter="url(#softGlow)">
    <circle cx="180" cy="292" r="4"/><circle cx="535" cy="220" r="4"/><circle cx="760" cy="150" r="4"/>
  </g>
  <g fill="#A855F7" opacity=".9">
    <circle cx="215" cy="257" r="3"/><circle cx="402" cy="220" r="3"/>
  </g>
  <g transform="translate(900 180)" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".7">
    <path d="M0-82L71-41V41L0 82L-71 41V-41Z"/>
    <path d="M0-54L47-27V27L0 54L-47 27V-27Z" opacity=".7"/>
    <path d="M0-82V-54M71-41L47-27M71 41L47 27M0 82V54M-71 41L-47 27M-71-41L-47-27"/>
    <circle cx="0" cy="0" r="14" fill="#22D3EE" fill-opacity=".12"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="82" y="116" fill="#A5F3FC" font-size="16" letter-spacing="5">RIYA RAJ</text>
    <text x="78" y="194" fill="#F8FAFC" font-size="68" font-weight="700" letter-spacing="1">Curious by design.</text>
    <rect x="82" y="218" width="390" height="3" rx="2" fill="url(#neon)"/>
    <text x="84" y="261" fill="#CBD5E1" font-size="20" letter-spacing="1.5">COMPUTER SCIENCE  /  AI &amp; ML  /  CYBERSECURITY</text>
    <text x="84" y="300" fill="#67E8F9" font-size="15" letter-spacing="1.2">Exploring ideas. Understanding systems. Building with purpose.</text>
  </g>
  <text x="1115" y="326" fill="#94A3B8" font-family="monospace" font-size="12" text-anchor="end">LEARN / EXPLORE / CREATE</text>
</svg>